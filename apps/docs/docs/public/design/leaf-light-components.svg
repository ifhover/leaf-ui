roke-linecap="round" stroke-linejoin="round"/><text x="332" y="778" fill="#202020" font-size="24" font-weight="600">Project saved</text><text x="278" y="812" fill="#707070" font-size="14" font-weight="400">Your changes are ready for the team.</text></g><g id="dialog-anatomy"><rect x="32" y="877" width="784" height="170" rx="16" fill="#ffffff" stroke="#e2e2e2"/><text x="56" y="910" fill="#202020" font-size="16" font-weight="600">Dialog heading</text><rect x="56" y="940" width="736" height="34" rx="10" fill="#ffffff" stroke="#e2e2e2"/><text x="66" y="962" fill="#707070" font-size="14" font-weight="400">Form and footer share an inline edge</text><rect x="680" y="997" width="112" height="34" rx="10" fill="#1e964f" stroke="none"/><text x="710" y="1019" fill="#ffffff" font-size="14" font-weight="500">Save</text></g></svg>
