<svg xmlns="http://www.w3.org/2000/svg" width="848" height="1080" viewBox="0 0 848 1080" font-family="Inter, Arial, sans-serif"><title>Leaf UI light design resources</title><rect x="0" y="0" width="848" height="1080" rx="0" fill="#ffffff" stroke="none"/><defs><filter id="button-outline-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.06"/></filter></defs><text x="32" y="50" fill="#202020" font-size="28" font-weight="600">Leaf UI / light component states</text><text x="32" y="118" fill="#707070" font-size="14" font-weight="400">solid</text><g id="button-solid-default" opacity="1"><rect x="160" y="94" width="136" height="34" rx="10" fill="#1e964f" stroke="none"/><text x="184" y="116" fill="#ffffff" font-size="14" font-weight="500">Default</text></g><g id="button-solid-hover" opacity="1"><rect x="320" y="94" width="136" height="34" rx="10" fill="#1e964f" stroke="none"/><text x="344" y="116" fill="#ffffff" font-size="14" font-weight="500">Hover</text></g><g id="button-solid-pressed" opacity="1"><rect x="480" y="94" width="136" height="34" rx="10" fill="rgba(26, 128, 67, 1)" stroke="none"/><text x="504" y="116" fill="#ffffff" font-size="14" font-weight="500">Pressed</text></g><g id="button-solid-disabled" opacity="0.45"><rect x="640" y="94" width="136" height="34" rx="10" fill="#1e964f" stroke="none"/><text x="664" y="116" fill="#ffffff" font-size="14" font-weight="500">Disabled</text></g><text x="32" y="202" fill="#707070" font-size="14" font-weight="400">outline</text><g id="button-outline-default" opacity="1"><rect x="160" y="178" width="136" height="34" rx="10" fill="#ffffff" stroke="#e2e2e2" filter="url(#button-outline-shadow)"/><text x="184" y="200" fill="#202020" font-size="14" font-weight="500">Default</text></g><g id="button-outline-hover" opacity="1"><rect x="320" y="178" width="136" height="34" rx="10" fill="#ffffff" stroke="#e2e2e2" filter="url(#button-outline-shadow)"/>