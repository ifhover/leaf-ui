name: Component quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter @ifhover/leaf-ui measure:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: production-bundles
          path: packages/react/.quality
          include-hidden-files: true
      - run: pnpm --filter @ifhover/leaf-ui exec playwright install --with-deps chromium
      - run: pnpm test:docs:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-browser
          include-hidden-files: true
          path: |
            packages/react/.quality/browser/*/html
            packages/react/.quality/browser/*/results
            packages/react/.quality/browser/*/report.json

  react-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The checks job already covers the locked React 19 workspace.
        react: ['18']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select React version
        run: pnpm --filter @ifhover/leaf-ui add --save-dev react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - run: pnpm --filter @ifhover/leaf-ui typecheck
      - run: pnpm --filter @ifhover/leaf-ui test

  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ifhover/leaf-ui exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @ifhover/leaf-ui test:browser --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          include-hidden-files: true
          path: |
            packages/react/.quality/browser/*/html
            packages/react/.quality/browser/*/results
            packages/react/.quality/browser/*/report.json
