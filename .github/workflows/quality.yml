name: Component quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter @ifhover/leaf-ui measure:bundle
      - name: Ensure checks did not change release sources
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v4
        with:
          name: production-bundles
          path: packages/react/.quality/bundle-report.json
          include-hidden-files: true
          retention-days: 7
      - name: Pack the checked release without rebuilding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm release:pack
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: npm-release
          include-hidden-files: true
          path: packages/react/.quality/release/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  react-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The checks job already covers the locked React 19 workspace.
        react: ['18']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select React version
        run: pnpm --filter @ifhover/leaf-ui add --save-dev react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - run: pnpm --filter @ifhover/leaf-ui typecheck
      - run: pnpm --filter @ifhover/leaf-ui test
