name: Publish npm package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ifhover/leaf-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - name: Validate release tag, source commit and npm version
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';

          const { RELEASE_TAG: tag, GITHUB_REF: ref, GITHUB_SHA: runCommit } = process.env;
          assert.match(tag, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Use a vX.Y.Z stable release tag, including when running the workflow manually.');
          assert.equal(ref, `refs/tags/${tag}`, 'Select the release tag under Run workflow, not a branch.');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const commit = git('rev-parse', 'HEAD');
          assert.equal(commit, runCommit, 'The checkout must match the workflow run commit for provenance.');
          assert.equal(git('rev-parse', `refs/tags/${tag}^{commit}`), commit, 'The checkout must match the release tag.');
          git('merge-base', '--is-ancestor', commit, 'origin/main');
          const pkg = JSON.parse(readFileSync('packages/react/package.json', 'utf8'));
          assert.equal(pkg.name, '@ifhover/leaf-ui');
          assert.equal(tag, `v${pkg.version}`, 'The tag must match packages/react/package.json.');
          assert.equal(pkg.repository.url, 'git+https://github.com/ifhover/leaf-ui.git');

          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}`, {
            signal: AbortSignal.timeout(30_000),
          });
          assert.ok(response.ok || response.status === 404, `npm registry returned ${response.status}.`);
          const registry = response.status === 404 ? {} : await response.json();
          const published = registry.versions?.[pkg.version];
          const latest = registry['dist-tags']?.latest;
          if (published) {
            assert.equal(published.gitHead, commit, 'This version was already published from a different commit. Bump the version.');
            assert.equal(latest, pkg.version, 'This version is no longer latest; refusing to republish an older release.');
            console.log(`${pkg.name}@${pkg.version} is already published from this commit; skipping the upload.`);
          } else if (latest) {
            assert.match(latest, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'npm latest must be a stable version.');
            const currentParts = pkg.version.split('.').map(BigInt);
            const latestParts = latest.split('.').map(BigInt);
            const differing = currentParts.findIndex((part, index) => part !== latestParts[index]);
            assert.ok(differing >= 0 && currentParts[differing] > latestParts[differing], 'The release version must be newer than npm latest.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\ncommit=${commit}\nalready_published=${Boolean(published)}\n`);
          NODE
      - name: Reuse the successful main quality run for this exact commit
        if: steps.release.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          for attempt in {1..12}; do
            quality_run=$(gh run list --workflow quality.yml --branch main --event push --commit "$RELEASE_COMMIT" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$quality_run" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$quality_run" ]]; then
            echo 'No main quality run exists for this commit. Run quality on the actual release commit before publishing.' >&2
            exit 1
          fi
          gh run watch "$quality_run" --exit-status --interval 10
          gh run download "$quality_run" --name npm-release --dir packages/react/.quality/release
          echo "Quality run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$quality_run" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the checked package identity and integrity
        if: steps.release.outputs.already_published != 'true'
        run: node packages/react/scripts/release-artifact.mjs verify
      - name: Install npm with trusted publishing support
        if: steps.release.outputs.already_published != 'true'
        run: npm install --global npm@11
      - name: Publish to npm using OIDC
        if: steps.release.outputs.already_published != 'true'
        working-directory: packages/react
        run: npm publish .quality/release/leaf-ui.tgz --access public --tag latest --provenance --registry https://registry.npmjs.org/
      - name: Verify published commit and latest tag
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          node packages/react/scripts/verify-release.mjs --npm-only --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --attempts 60
          echo 'npm verified. The Deploy documentation workflow runs next; the release is not complete until it succeeds.' >> "$GITHUB_STEP_SUMMARY"
