name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source and component behavior
        run: pnpm check
      - name: Build library and documentation
        run: pnpm build
        env:
          LEAF_DOCS_BASE: /leaf-ui/
      - name: Cache published documentation snapshots
        uses: actions/cache@v4
        with:
          path: apps/docs/.version-cache
          key: leaf-ui-docs-${{ runner.os }}-${{ github.sha }}
          restore-keys: leaf-ui-docs-${{ runner.os }}-
      - name: Build versioned documentation from published npm commits
        run: pnpm build:versions
        env:
          LEAF_DOCS_BASE: /leaf-ui/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/site_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
